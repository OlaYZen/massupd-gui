<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mass Update System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('upload') }}" class="{% if request.endpoint == 'upload' %}active{% endif %}">Upload</a>
        <a href="{{ url_for('manage_connections') }}" class="{% if request.endpoint == 'manage_connections' %}active{% endif %}">Add/Remove Connections</a>
        <a href="{{ url_for('backup') }}" class="{% if request.endpoint == 'backup' %}active{% endif %}">Backup</a>
        <a href="{{ url_for('log_view') }}" class="{% if request.endpoint == 'log_view' %}active{% endif %}">Logs</a>
        <a href="{{ url_for('credits') }}" class="{% if request.endpoint == 'credits' %}active{% endif %}">Credits</a>
        <a href="{{ url_for('logout') }}" class="{% if request.endpoint == 'credits' %}active{% endif %}">Logout</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="flash-message" id="flash-message">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
    </div>
    <script>
        window.onload = function() {
            var flashMessage = document.getElementById('flash-message');
            if (flashMessage.innerHTML.trim()) {
                flashMessage.classList.add('show');
                setTimeout(function() {
                    flashMessage.classList.remove('show');
                }, 3000);
            }
        };
    </script>
    <script src="{{url_for('static', filename='input.js')}}"></script>
</body>
</html>
